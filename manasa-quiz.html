<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مراجعة أدوار منصّة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap">
<style>
/* iSchool brand: blue #056FEC (60%), orange #FF7F1C (30%), yellow #FFD700 (10%), deep blue #043FAD, navy text #1F2A55 */
:root{
  --white:#FFFFFF; --tint:#F7FAFF; --line:#E6EDF1; --line2:#B1D1E6;
  --ink:#1F2A55; --muted:#597587;
  --blue:#056FEC; --blue-deep:#043FAD; --sky:#05ACFF; --orange:#FF7F1C; --yellow:#FFD700;
  --ok:#0EAA3A; --ok-deep:#0A852D; --ok-bg:#BCECCA; --bad:#DE1F1F; --bad-deep:#AA1818; --bad-bg:#FFD1D1; --gold:#FFBB1C;
  --font:'Somar Rounded','Readex Pro',Tahoma,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--white);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:900px;margin-inline:auto}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px;border-bottom:1px solid var(--line);margin-bottom:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:116px;height:auto;display:block}
.brand .sep{width:1px;height:28px;background:var(--line)}
.brand .app{font-weight:700;color:var(--blue-deep);font-size:18px}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;border:1.5px solid var(--line);background:var(--white)}
.pill.pts{border-color:var(--yellow);background:#FFF8CC}
.pill.streak{border-color:var(--orange);color:var(--orange)}
.pill.home{cursor:pointer;color:var(--blue)}
.bump{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.25)}100%{transform:scale(1)}}

/* home */
.hero{display:grid;gap:10px;margin-bottom:24px}
.eyebrow{color:var(--orange);font-weight:600;font-size:14px}
h1{margin:0;font-size:clamp(28px,5.5vw,40px);line-height:1.2;color:var(--blue-deep);text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:60ch}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.role{position:relative;overflow:hidden;text-align:right;cursor:pointer;background:var(--white);border:1.5px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:8px;transition:transform .15s,border-color .15s,box-shadow .15s}
.role:hover{transform:translateY(-3px);border-color:var(--blue);box-shadow:0 10px 24px rgba(5,111,236,.12)}
.role .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--tint);color:var(--blue)}
.role .ic svg{width:28px;height:28px}
.role h3{margin:0;font-size:21px}
.role p{margin:0;color:var(--muted);font-size:14px}
.role .meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}
.stars{color:var(--gold);letter-spacing:2px;font-size:16px}
.role.all{background:var(--blue);border-color:var(--blue);color:var(--white)}
.role.all p,.role.all .meta{color:#E6EDF1}
.role.all .ic{background:rgba(255,255,255,.18);color:var(--yellow)}
.dot{position:absolute;left:-30px;bottom:-30px;width:90px;height:90px;border-radius:50%;background:var(--yellow);opacity:.18}
.role.all .dot{opacity:.35}

/* role screen */
.rhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.rhead h2{margin:0;font-size:clamp(22px,4vw,30px);color:var(--blue-deep)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{border:0;background:var(--white);padding:9px 18px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--white)}
.prog{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:16px}
.track{flex:1;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--yellow));transition:width .4s}

.card{position:relative;background:var(--white);border:1.5px solid var(--line);border-radius:24px;padding:24px;display:grid;gap:16px;box-shadow:0 6px 20px rgba(31,42,85,.06)}
.card.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.card.glow{animation:glow .7s}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(14,170,58,.5)}100%{box-shadow:0 0 0 18px rgba(14,170,58,0)}}
.tag{justify-self:start;font-size:13px;font-weight:600;padding:3px 12px;border-radius:999px;background:var(--tint);color:var(--blue-deep);border:1px solid var(--line2)}
.q{margin:0;font-size:clamp(19px,3.4vw,24px);font-weight:600;line-height:1.5;text-wrap:balance}
.timer{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--blue);width:100%}
.opts{display:grid;gap:10px}
.opt{text-align:right;display:flex;gap:12px;align-items:center;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--white);cursor:pointer;line-height:1.5;transition:transform .1s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--blue);transform:translateX(-3px)}
.opt .k{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--tint);font-weight:700;color:var(--blue)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);color:var(--white)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:var(--white)}
.opt:disabled{cursor:default}
.opt .mk{margin-inline-start:auto;font-weight:700;font-size:13px;white-space:nowrap}
.opt.right .mk{color:var(--ok-deep)} .opt.wrong .mk{color:var(--bad-deep)}
.feedback{border-radius:16px;padding:14px 16px;display:grid;gap:4px}
.feedback.ok{background:#EAF8EE;border:1.5px solid var(--ok)}
.feedback.bad{background:#FFF1F1;border:1.5px solid var(--bad)}
.feedback b{font-size:17px}
.feedback.ok b{color:var(--ok-deep)} .feedback.bad b{color:var(--bad-deep)}
.feedback p{margin:0}
.src{font-size:13px;color:var(--muted)}
.hintbtn{justify-self:start;background:none;border:0;color:var(--blue);cursor:pointer;text-decoration:underline;padding:0;font-size:14px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{font-weight:700;padding:11px 22px;border-radius:14px;border:1.5px solid var(--line);background:var(--white);cursor:pointer}
.btn.go{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:var(--white)}
.btn:disabled{opacity:.4;cursor:default}

/* floating points */
.float{position:absolute;top:18px;left:24px;font-weight:800;font-size:26px;pointer-events:none;animation:up 1s forwards}
.float.p{color:var(--ok)} .float.m{color:var(--bad)}
@keyframes up{0%{opacity:0;transform:translateY(10px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translateY(-50px) scale(1.2)}}

/* flashcards */
.flip{border:0;background:none;padding:0;cursor:pointer;perspective:1400px;width:100%;text-align:right}
.inner{display:grid;transition:transform .55s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:300px;border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:14px;border:1.5px solid var(--line);background:var(--white);box-shadow:0 6px 20px rgba(31,42,85,.06)}
.face.front{background:linear-gradient(160deg,var(--white) 60%,var(--tint))}
.face.back{transform:rotateY(180deg);border-color:var(--blue);background:var(--white)}
.face .ans{margin:0;font-size:clamp(19px,3.4vw,23px);font-weight:700;color:var(--blue-deep)}
.face .tap{margin-top:auto;font-size:13px;color:var(--muted)}
.know{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn.ok{border-color:var(--ok);color:var(--ok-deep)} .btn.bad{border-color:var(--bad);color:var(--bad-deep)}

/* results */
.result{text-align:center;justify-items:center}
.medal{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:56px;background:radial-gradient(circle at 35% 30%,#FFF3A6,var(--yellow) 60%,var(--gold));box-shadow:0 10px 30px rgba(255,187,28,.45)}
.medal.silver{background:radial-gradient(circle at 35% 30%,#fff,#D7E1EA 60%,#B1C2D1);box-shadow:0 10px 30px rgba(89,117,135,.3)}
.medal.bronze{background:radial-gradient(circle at 35% 30%,#FFD9B8,var(--orange) 60%,#C85F10);box-shadow:0 10px 30px rgba(255,127,28,.35)}
.big{font-size:clamp(40px,8vw,60px);font-weight:800;color:var(--blue-deep);line-height:1.1;font-variant-numeric:tabular-nums}
.statrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat{min-width:120px;padding:12px 16px;border-radius:16px;background:var(--tint);border:1px solid var(--line)}
.stat b{display:block;font-size:24px;color:var(--blue-deep);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.missed{display:grid;gap:8px;width:100%;text-align:right}
.missed div{padding:12px 14px;border-radius:14px;background:#FFF1F1;border:1px solid var(--bad-bg);font-size:15px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
footer{margin-top:28px;text-align:center;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const AR='٠١٢٣٤٥٦٧٨٩', n=x=>String(x).replace(/\d/g,d=>AR[d]);
const $=s=>document.querySelector(s), app=$('#app');
const KEY='manasa-quiz-game-v2';
let best={}; try{best=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const saveBest=()=>{try{localStorage.setItem(KEY,JSON.stringify(best))}catch(e){}};
let S=null; // current session
const TIME=30; // seconds per question for speed bonus

// sounds (start only after a click)
let ac=null;
function tone(freqs,dur=.12,type='sine'){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  freqs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  const t=ac.currentTime+i*dur;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02);});}catch(e){}}
const sGood=()=>tone([660,880,1100],.09,'triangle'), sBad=()=>tone([220,160],.16,'sawtooth'), sWin=()=>tone([523,659,784,1047],.12,'triangle');

// confetti
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[];
function resize(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',resize);resize();
function confetti(count=120){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#056FEC','#FF7F1C','#FFD700','#05ACFF','#0EAA3A'];
  for(let i=0;i<count;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,s:Math.random()*8+4,c:cols[i%5],r:Math.random()*6,life:120});
  if(parts.length===count)requestAnimationFrame(tick);}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.1;p.life--;
  cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+20);if(parts.length)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height);}

function hud(){$('#pts').textContent=n(S?S.pts:0);$('#streak').textContent=n(S?S.streak:0);$('#home-btn').hidden=!S;}
function bump(id){const el=$(id);el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
function starsFor(pct){return pct>=90?3:pct>=70?2:pct>=40?1:0}
const starStr=k=>'★'.repeat(k)+'☆'.repeat(3-k);
const idsFor=r=>Q.map((_,k)=>k).filter(k=>r==='all'||Q[k].r===r);

/* ---------- Home ---------- */
function home(){S=null;hud();stopTimer();
  app.innerHTML=`<section class="hero"><span class="eyebrow">دليل تدريب منصّة</span><h1>اختر دورك وابدأ التحدّي</h1>
  <p class="lede">لكل دور أسئلة وبطاقات استذكار من الدليل التدريبي. اجمع النقاط بالإجابات الصحيحة، وضاعفها بسلسلة الإجابات المتتالية والسرعة.</p></section>
  <div class="roles" id="roles"></div>`;
  const box=$('#roles');
  ROLES.forEach(r=>{const c=idsFor(r.id).length,b=best[r.id],st=b?starsFor(b.pct):0;
    const el=document.createElement('button');el.className='role'+(r.id==='all'?' all':'');el.id='role-'+r.id;
    el.innerHTML=`<span class="dot"></span><span class="ic">${ICONS[r.id]}</span><h3>${r.name}</h3><p>${r.desc}</p>
      <span class="meta"><span>${n(c)} سؤالًا${b?' · أفضل نتيجة '+n(b.pts)+' نقطة':''}</span><span class="stars" aria-label="${n(st)} من ٣ نجوم">${starStr(st)}</span></span>`;
    el.onclick=()=>start(r.id);box.appendChild(el);});}

/* ---------- Session ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(role,mode='quiz',ids){S={role,mode,ids:ids||shuffle(idsFor(role)),i:0,ans:{},known:{},pts:0,streak:0,bestStreak:0,correct:0};hud();render();}
let timer=null,left=TIME;
function stopTimer(){clearInterval(timer);timer=null}
function startTimer(){stopTimer();left=TIME;const bar=$('#tbar');timer=setInterval(()=>{left-=.1;if(bar)bar.style.width=Math.max(0,left/TIME*100)+'%';if(left<=0)stopTimer();},100);}

function render(){stopTimer();const role=ROLES.find(r=>r.id===S.role);
  app.innerHTML=`<div class="rhead"><h2>${role.name}</h2><div class="seg" role="group" aria-label="طريقة المراجعة">
    <button id="m-quiz" aria-pressed="${S.mode==='quiz'}">🎯 اختبار</button><button id="m-cards" aria-pressed="${S.mode==='cards'}">🃏 بطاقات استذكار</button></div></div>
    <div class="prog"><span id="pos"></span><div class="track"><div class="fill" id="fill"></div></div><span id="sc"></span></div><div id="stage"></div>`;
  $('#m-quiz').onclick=()=>{if(S.mode!=='quiz')start(S.role,'quiz')};
  $('#m-cards').onclick=()=>{if(S.mode!=='cards')start(S.role,'cards')};
  const N=S.ids.length,pos=Math.min(S.i,N);$('#pos').textContent=n(Math.min(pos+1,N))+' / '+n(N);
  $('#fill').style.width=(pos/N*100)+'%';
  $('#sc').textContent=S.mode==='quiz'?('✔ '+n(S.correct)+' صحيحة'):('أعرفها '+n(Object.keys(S.known).length));
  const stage=$('#stage');
  if(S.i>=N){stage.appendChild(result());return;}
  stage.appendChild(S.mode==='quiz'?quizCard(S.ids[S.i]):flashCard(S.ids[S.i]));
  const nav=document.createElement('div');nav.className='nav';
  const prev=Object.assign(document.createElement('button'),{className:'btn',id:'prev',textContent:'→ السابق',disabled:S.i===0});
  const k=S.ids[S.i],answered=S.mode==='cards'||(k in S.ans);
  const next=Object.assign(document.createElement('button'),{className:'btn go',id:'next',textContent:S.i===N-1?'النتيجة 🏁':'التالي ←',disabled:!answered});
  prev.onclick=()=>{S.i--;render()};next.onclick=()=>{S.i++;render()};nav.append(prev,next);stage.appendChild(nav);
  if(S.mode==='quiz'&&!answered)startTimer();}

function quizCard(k){const q=Q[k],picked=S.ans[k],done=picked!==undefined,c=document.createElement('section');c.className='card';c.id='card';
  c.innerHTML=`<span class="tag">${ROLES.find(r=>r.id===q.r)?.name||''}</span><h3 class="q">${q.q}</h3>${done?'':'<div class="timer" title="أجب بسرعة لتحصل على نقاط إضافية"><i id="tbar"></i></div>'}`;
  const opts=document.createElement('div');opts.className='opts';
  q.o.forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.id='opt-'+j;
    b.innerHTML=`<span class="k">${'أبجد'[j]}</span><span>${t}</span>`;
    if(done){b.disabled=true;if(j===q.a){b.classList.add('right');b.innerHTML+='<span class="mk">✔ الصحيحة</span>'}else if(j===picked){b.classList.add('wrong');b.innerHTML+='<span class="mk">✘ إجابتك</span>'}}
    b.onclick=()=>answer(k,j);opts.appendChild(b);});
  c.appendChild(opts);
  if(!done&&q.h){const hb=Object.assign(document.createElement('button'),{className:'hintbtn',id:'hint',textContent:'💡 تلميح (−٥ نقاط)'});
    hb.onclick=()=>{S.pts=Math.max(0,S.pts-5);S.hinted=k;hud();hb.replaceWith(Object.assign(document.createElement('p'),{className:'src',textContent:'تلميح: '+q.h}))};c.appendChild(hb);}
  if(done){const ok=picked===q.a,f=document.createElement('div');f.className='feedback '+(ok?'ok':'bad');
    f.innerHTML=`<b>${ok?pick(['ممتاز! 🎉','أحسنت! 👏','إجابة صحيحة ✨','رائع، واصل! 🚀']):pick(['ليست هذه 🙁','قريبة، راجع الشرح 👇','لا بأس، تعلّمنا شيئًا 📘'])}</b><p>${q.e}</p><span class="src">📍 ${q.s}</span>`;c.appendChild(f);}
  return c;}
const pick=a=>a[Math.floor(Math.random()*a.length)];

function answer(k,j){if(k in S.ans)return;const q=Q[k],ok=j===q.a;S.ans[k]=j;stopTimer();
  let gain=0;
  if(ok){S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);S.correct++;
    const speed=Math.round(Math.max(0,left)/TIME*5);const mult=S.streak>=5?3:S.streak>=3?2:1;
    gain=(10+speed)*mult;S.pts+=gain;sGood();if(S.streak===3||S.streak===5||S.streak%10===0)confetti(60);}
  else{S.streak=0;gain=-3;S.pts=Math.max(0,S.pts-3);sBad();}
  hud();bump('#hud-pts');if(ok)bump('#hud-streak');
  render();const card=$('#card');card.classList.add(ok?'glow':'shake');
  const fl=document.createElement('span');fl.className='float '+(ok?'p':'m');fl.textContent=(ok?'+':'')+n(gain);card.appendChild(fl);
  if(ok&&S.streak>=3){const b=document.createElement('span');b.className='float p';b.style.top='54px';b.style.fontSize='18px';b.textContent='🔥 ×'+n(S.streak>=5?3:2);card.appendChild(b);}}

function flashCard(k){const q=Q[k],w=document.createElement('section');
  const f=document.createElement('button');f.className='flip';f.id='flip';f.setAttribute('aria-label','اقلب البطاقة');
  f.innerHTML=`<div class="inner"><div class="face front"><span class="tag">${ROLES.find(r=>r.id===q.r)?.name||''}</span><h3 class="q">${q.q}</h3><span class="tap">👆 اضغط لترى الإجابة</span></div>
   <div class="face back"><span class="tag">الإجابة</span><p class="ans">${q.o[q.a]}</p><p style="margin:0">${q.e}</p><span class="src">📍 ${q.s}</span><span class="tap">اضغط للعودة إلى السؤال</span></div></div>`;
  f.onclick=()=>{f.classList.toggle('on');tone([500],.05)};w.appendChild(f);
  const kn=document.createElement('div');kn.className='know';
  const y=Object.assign(document.createElement('button'),{className:'btn ok',id:'know',textContent:'✔ أعرفها (+٥)'});
  const no=Object.assign(document.createElement('button'),{className:'btn bad',id:'again',textContent:'↺ أحتاج مراجعتها'});
  y.onclick=()=>{if(!S.known[k]){S.known[k]=1;S.pts+=5;sGood();hud();bump('#hud-pts')}S.i++;render()};
  no.onclick=()=>{delete S.known[k];S.i++;render()};kn.append(y,no);w.appendChild(kn);return w;}

function result(){const c=document.createElement('section');c.className='card result';const N=S.ids.length;
  if(S.mode==='quiz'){const pct=Math.round(S.correct/N*100),st=starsFor(pct);
    const prev=best[S.role];const isBest=!prev||S.pts>prev.pts;if(isBest){best[S.role]={pts:S.pts,pct};saveBest();}
    const title=pct>=90?'خبير الدور 🏆':pct>=70?'جاهز للعمل 🎖️':pct>=40?'في الطريق الصحيح 📈':'ابدأ بمراجعة البطاقات 📘';
    c.innerHTML=`<div class="medal ${pct>=90?'':pct>=70?'silver':'bronze'}">${pct>=90?'🏆':pct>=70?'🥈':pct>=40?'🥉':'📘'}</div>
     <h2 style="margin:0;color:var(--blue-deep)">${title}</h2><div class="stars" style="font-size:34px">${starStr(st)}</div>
     <div class="big">${n(S.pts)} نقطة</div>${isBest&&prev?'<span class="tag">🎉 رقم قياسي جديد لهذا الدور</span>':''}
     <div class="statrow"><div class="stat"><b>${n(S.correct)} / ${n(N)}</b><span>إجابات صحيحة</span></div>
     <div class="stat"><b>${n(pct)}٪</b><span>نسبة النجاح</span></div><div class="stat"><b>🔥 ${n(S.bestStreak)}</b><span>أطول سلسلة</span></div></div>`;
    const miss=S.ids.filter(k=>S.ans[k]!==undefined&&S.ans[k]!==Q[k].a);
    if(miss.length){const m=document.createElement('div');m.className='missed';m.innerHTML='<b>راجع هذه الأسئلة:</b>';
      miss.forEach(k=>m.insertAdjacentHTML('beforeend',`<div>${Q[k].q}<br><b>الصحيح:</b> ${Q[k].o[Q[k].a]} · <span class="src">${Q[k].s}</span></div>`));c.appendChild(m);}
    const a=document.createElement('div');a.className='actions';
    a.append(btn('↻ العب مرّة أخرى','go',()=>start(S.role,'quiz')));
    if(miss.length)a.append(btn('🃏 راجع الأخطاء كبطاقات','blue',()=>start(S.role,'cards',miss)));
    a.append(btn('⌂ اختر دورًا آخر','',home));c.appendChild(a);
    if(pct>=70){sWin();confetti(180)}
  }else{const k=Object.keys(S.known).length,unk=S.ids.filter(x=>!S.known[x]);
    c.innerHTML=`<div class="medal ${k===N?'':'silver'}">${k===N?'🧠':'🃏'}</div><h2 style="margin:0;color:var(--blue-deep)">${k===N?'عرفت كل البطاقات!':'جولة البطاقات انتهت'}</h2>
     <div class="big">${n(k)} / ${n(N)}</div><p style="margin:0">${unk.length?'بقيت '+n(unk.length)+' بطاقة للمراجعة.':'جرّب الآن وضع الاختبار لجمع النقاط.'}</p>`;
    const a=document.createElement('div');a.className='actions';
    if(unk.length)a.append(btn('↺ راجع المتبقّية فقط','go',()=>start(S.role,'cards',unk)));
    a.append(btn('🎯 ابدأ الاختبار','blue',()=>start(S.role,'quiz')),btn('⌂ اختر دورًا آخر','',home));c.appendChild(a);
    if(k===N){sWin();confetti(150)}}
  return c;}
function btn(t,cls,fn){const b=document.createElement('button');b.className='btn '+cls;b.textContent=t;b.onclick=fn;return b}

$('#home-btn').onclick=home;
document.addEventListener('keydown',e=>{if(!S||S.i>=S.ids.length)return;const k=S.ids[S.i];
  if(S.mode==='quiz'&&!(k in S.ans)&&['1','2','3','4'].includes(e.key))answer(k,+e.key-1);
  else if(S.mode==='cards'&&e.key===' '){e.preventDefault();$('#flip')?.classList.toggle('on')}
  else if(e.key==='Enter'){$('#next')&&!$('#next').disabled&&$('#next').click()}});
home();
</script>
</body>
</html>
